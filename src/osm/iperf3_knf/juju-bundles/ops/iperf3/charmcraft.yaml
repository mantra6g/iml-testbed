# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: iperf3
title: iperf3
summary: Run iperf3 network throughput tests as a server or a client.
description: |
  A charm that drives an iperf3 workload container to measure network throughput.

  It exposes actions to start/stop iperf3 as a server (listener) or as a client that
  connects to a remote server, plus configuration options to choose TCP or UDP and the
  server address a client should target.

  This charm meets the need for an easily deployable, Juju-managed traffic generator
  for validating network paths (e.g. inside an OSM/Kubernetes NFV testbed).

  Useful for network engineers and NFV testbed operators who need on-demand iperf3
  endpoints without manually exec-ing into containers.

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

# (Optional) Configuration options for the charm
# This config section defines charm config options, and populates the Configure
# tab on Charmhub.
# More information on this section at:
# https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/#config
# General configuration documentation:
# https://documentation.ubuntu.com/juju/3.6/reference/configuration/#application-configuration
config:
  options:
    protocol:
      description: |
        Transport protocol iperf3 should use, for both the server and the client roles.

        Acceptable values are: "tcp" and "udp".
      default: "tcp"
      type: string
    server-address:
      description: |
        Hostname or IP address that the start-client action connects to by default.

        Required before running the start-client action, unless overridden by that
        action's "target" parameter.
      default: ""
      type: string
    port:
      description: |
        Default port the iperf3 server listens on and the client connects to.

        Can be overridden per-action via the "port" parameter.
      default: 5201
      type: int

# Your workload's containers.
# https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/#containers
containers:
  iperf3:
    resource: iperf3-image

# This field populates the Resources tab on Charmhub.
# https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/#resources
resources:
  # An OCI image resource for each container listed above.
  # You may remove this if your charm will run without a workload sidecar container.
  iperf3-image:
    type: oci-image
    description: OCI image for the 'iperf3' container
    # The upstream-source field is ignored by Charmcraft and Juju, but it can be
    # useful to developers in identifying the source of the OCI image.  It is also
    # used by the 'canonical/charming-actions' GitHub action for automated releases.
    # The test_deploy function in tests/integration/test_charm.py reads upstream-source
    # to determine which OCI image to use when running the charm's integration tests.
    upstream-source: mlabbe/iperf3:3.19.1-r1

actions:
  start-server:
    description: |
      Start iperf3 as a server (listener). Fails if iperf3 is already running as a
      client on this unit.
    params:
      port:
        type: integer
        description: Port to listen on (overrides the "port" config option).
      one-off:
        type: boolean
        description: Handle exactly one client connection and then exit.
        default: false
    additionalProperties: false
  stop-server:
    description: |
      Stop the running iperf3 server. Fails if iperf3 is not currently running as a
      server.
  start-client:
    description: |
      Start iperf3 as a client and send/receive traffic to/from a server. Fails if
      iperf3 is already running as a server on this unit.
    params:
      target:
        type: string
        description: |
          Hostname or IP of the iperf3 server (overrides the "server-address" config
          option).
      port:
        type: integer
        description: Port of the target server (overrides the "port" config option).
      duration:
        type: integer
        description: Duration of the test, in seconds.
      bandwidth:
        type: string
        description: Target bandwidth (e.g. "10M"), mainly useful for UDP tests.
      parallel:
        type: integer
        description: Number of parallel client streams.
      reverse:
        type: boolean
        description: Run in reverse mode (server sends, client receives).
        default: false
    additionalProperties: false
  stop-client:
    description: |
      Stop the running iperf3 client. Fails if iperf3 is not currently running as a
      client.

