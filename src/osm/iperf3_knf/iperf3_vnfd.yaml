vnfd:
  id: iperf3_knf
  product-name: iperf3_knf
  version: 1.0
  description: "Containerized iperf3 endpoints"
  provider: MANTRA6G

  kdu:
  - name: iperf3-kdu
    juju-bundle: bundle.yaml

  df:
  - id: default-df

  mgmt-cp: mgmt-ext
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: mgmtnet
  - id: data-ext
    k8s-cluster-net: datanet

  k8s-cluster:
    nets:
    - id: mgmtnet
    - id: datanet