nsd:
  nsd:
  - id: p4_iperf_scenario_ns
    name: p4_iperf_scenario_ns
    version: 1.0
    description: "Topology: NS with BMv2 switch"
    designer: MANTRA6G
    
    vnfd-id:
      - p4_switch_knf

    virtual-link-desc:
    - id: mgmtnet
      mgmt-network: true

    df:
    - id: default-df
      vnf-profile:
      - id: p4-switch
        vnfd-id: p4_switch_knf
        virtual-link-connectivity:
        - virtual-link-profile-id: mgmtnet
          constituent-cpd-id:
          - constituent-base-element-id: p4-switch
            constituent-cpd-id: mgmt-ext