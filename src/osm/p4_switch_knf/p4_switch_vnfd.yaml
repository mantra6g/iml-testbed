vnfd:
  id: p4_switch_knf
  product-name: p4_switch_knf
  version: "1.0"
  description: P4 BMv2 switch managed by Juju Charm
  provider: MANTRA6G

  kdu:
  - name: p4-switch-kdu
    helm-chart: oci://ghcr.io/tomasagata/helm/p4-switch:0.1.0
    service:
    - name: p4-switch

  df:
  - id: default-df
    lcm-operations-configuration:
        operate-vnf-op-config:
          day1-2:
            - id: p4-switch
              execution-environment-list:
              - id: p4-switch-ee
                juju:
                  charm: bmv2_amd64.charm
              config-primitive:
              - name: set-table-entries
                execution-environment-ref: p4-switch-ee
                parameter:
                - name: entries_json
                  data-type: STRING
                  mandatory: true
  
  mgmt-cp: mgmt-ext
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: mgmtnet
  # Separated internal cluster networks for the P4 pipeline pipeline
  - id: ingress-ext
    k8s-cluster-net: ingressnet
  - id: egress-ext
    k8s-cluster-net: egressnet

  k8s-cluster:
    nets:
    - id: mgmtnet
    - id: ingressnet
    - id: egressnet
