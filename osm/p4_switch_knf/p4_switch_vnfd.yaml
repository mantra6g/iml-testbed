vnfd:
  id: p4_switch_knf
  product-name: p4_switch_knf
  version: "1.0"
  description: P4 BMv2 switch managed by Juju Charm
  provider: MANTRA6G

  kdu:
  - name: p4-switch-kdu
    helm-chart: bundle.yaml

  df:
  - id: default-df
  
  mgmt-cp: mgmt-ext
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: mgmtnet
  # Separated internal cluster networks for the P4 pipeline pipeline
  - id: ingress-ext
    k8s-cluster-net: ingressnet
  - id: egress-ext
    k8s-cluster-net: egressnet

  k8s-cluster:
    nets:
    - id: mgmtnet
    - id: ingressnet
    - id: egressnet