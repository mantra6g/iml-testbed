vnfd:
  id: p4_switch_knf
  product-name: p4_switch_knf
  version: "1.0"
  description: P4 BMv2 switch managed by Juju Charm
  provider: MANTRA6G

  kdu:
  - name: p4-switch-kdu
    juju-bundle: bundle.yaml

  df:
  - id: default-df
    lcm-operations-configuration:
      operate-vnf-op-config:
        day1-2:
        # References the name of your KDU block above
        - id: p4-switch-kdu
          config-primitive:
          - name: addurl
            parameter:
            - data-type: STRING
              default-value: squid
              name: application-name
            - data-type: STRING
              default-value: ''
              name: url
          - name: deleteurl
            parameter:
            - data-type: STRING
              default-value: squid
              name: application-name
            - data-type: STRING
              default-value: ''
              name: url
  
  mgmt-cp: mgmt-ext
  ext-cpd:
  - id: mgmt-ext
    k8s-cluster-net: mgmtnet
  # Separated internal cluster networks for the P4 pipeline pipeline
  - id: ingress-ext
    k8s-cluster-net: ingressnet
  - id: egress-ext
    k8s-cluster-net: egressnet

  k8s-cluster:
    nets:
    - id: mgmtnet
    - id: ingressnet
    - id: egressnet