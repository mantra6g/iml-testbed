---
- name: kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-cert-extra-sans={{ ansible_host }}
    --cri-socket=unix:///run/containerd/containerd.sock
  args:
    creates: /etc/kubernetes/admin.conf

- name: Create .kube directory for the ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copy admin.conf to the ubuntu user's kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Install the Flannel CNI
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f
    https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: cp_flannel_apply
  changed_when: "'unchanged' not in cp_flannel_apply.stdout"

- name: Wait for the control-plane node to report Ready
  ansible.builtin.command: >
    kubectl --kubeconfig=/etc/kubernetes/admin.conf
    wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Generate the kubeadm join command for worker nodes
  ansible.builtin.command: kubeadm token create --print-join-command
  register: cp_join_command
  changed_when: false

- name: Persist the join command for worker nodes
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      {{ cp_join_command.stdout }} --cri-socket=unix:///run/containerd/containerd.sock
    dest: "{{ playbook_dir }}/join-command.sh"
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Read the kubeconfig from the control-plane node
  ansible.builtin.slurp:
    src: /etc/kubernetes/admin.conf
  register: cp_kubeconfig_b64

- name: Write the kubeconfig to this machine with the control-plane's public IP
  ansible.builtin.copy:
    content: >-
      {{ (cp_kubeconfig_b64.content | b64decode)
         | regex_replace('https://' + ansible_default_ipv4.address + ':6443',
                          'https://' + ansible_host + ':6443') }}
    dest: "{{ local_kubeconfig_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
